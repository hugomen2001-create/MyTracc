name: Sync MyTracc -> Google Sheets

on:
  schedule:
    # 23:30 UTC todas las noches (~00:30/01:30 hora de España segun horario de verano).
    - cron: '30 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sheet-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: node src/index.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          SPREADSHEET_ID_WEEKLY: ${{ vars.SPREADSHEET_ID_WEEKLY }}
          SPREADSHEET_ID_PLAN: ${{ vars.SPREADSHEET_ID_PLAN }}
          ACTIVE_MESOCICLO_TAB: ${{ vars.ACTIVE_MESOCICLO_TAB }}
          DEBUG_SYNC: 'true'

      # GitHub desactiva los workflows programados tras 60 dias sin actividad en
      # el repo (paso el 15-sep-2026 y el sync estuvo parado 20 dias). Volver a
      # habilitarlo por API en cada ejecucion reinicia ese contador.
      - name: Evitar desactivacion por inactividad
        if: always()
        working-directory: .
        run: |
          curl -sS -o /dev/null -w "keepalive: %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sheet-sync.yml/enable"
